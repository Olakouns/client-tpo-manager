<div class="p-3">
  <div class="container-fluid px-5">
    <div class="mx-5">
      <div class="position-relative">
        <img class="w-100 slide-img" [src]="inputData.image" alt="" srcset="">
        <div
          class="bg-121212 position-absolute top-0 bottom-0 start-0 end-0 text-white d-flex justify-content-center align-items-center text-center br-16">
          <h6 class="fs-3 mb-0" [innerHTML]="inputData.description"></h6>
        </div>
      </div>

      <div class="mt-4">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed config-btn">
  <button mat-fab class="fab-btn" [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
    <mat-icon>settings</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <a *ngIf="!isCurrentRoute" mat-menu-item routerLink="/tpo-management">
      <mat-icon>extension</mat-icon>
      <span>TPO list</span>
    </a>
    <a mat-menu-item routerLink="/tpo-management/work-orders">
      <mat-icon>timeline</mat-icon>
      <span>Work orders</span>
    </a>
    <a mat-menu-item routerLink="/tpo-management/constant-config">
      <mat-icon>dialpad</mat-icon>
      <span>Network Elements</span>
    </a>
<!--    <button mat-menu-item>-->
<!--      <mat-icon>settings</mat-icon>-->
<!--      <span>Setting</span>-->
<!--    </button>-->
    <button mat-menu-item (click)="onLogout()">
      <mat-icon>exit_to_app</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</div>
