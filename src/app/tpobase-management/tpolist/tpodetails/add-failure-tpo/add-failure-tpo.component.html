<mat-dialog-content>
    <div class="my-dialog">
      <h4 class="my-dialog-title text-center">{{diagTitle}}</h4>
  
      <div class="alert alert-danger" *ngIf="hasError">
        {{errorMessage}}
      </div>
      <!--  form-->
      <div class="mt-4">
  
        <form [formGroup]="form" (ngSubmit)="onSubmit()">  
          <mat-form-field class="w-100" appearance="outline">
            <mat-select formControlName="tpo" placeholder="Sélectionné le tpo">
              <mat-option>
                <ngx-mat-select-search formControlName="tpoFilter"
                                       placeholderLabel="Recherche"
                                       noEntriesFoundLabel="aucun tpo trouvé"
                ></ngx-mat-select-search>
              </mat-option>
              <mat-option *ngFor="let tpo of filteredTpo | async" [value]="tpo.id">{{tpo.tpo}}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.controls['tpo']?.hasError('required')">Required field</mat-error>
          </mat-form-field>

  
          <div class="d-flex justify-content-center align-items-center" *ngIf="!isLoading">
            <button mat-flat-button color="primary" class="rounded-5 p-4 close-btn me-4" type="button"
                    (click)="onClose()">Close
            </button>
            <button mat-flat-button color="primary" class="rounded-5 p-4" type="submit">Save</button>
          </div>
  
          <div class="d-flex justify-content-center" *ngIf="isLoading">
            <mat-spinner diameter="20" mode="indeterminate"></mat-spinner>
          </div>
        </form>
  
  
      </div>
    </div>
  
  </mat-dialog-content>
