<mat-dialog-content>
  <div class="my-dialog">
    <h4 class="my-dialog-title text-center">Confirmation</h4>
    <p class="mt-4 text-center mb-0">{{data}}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions class="d-flex justify-content-center w-100 p-4">
  <button mat-flat-button color="warn" (click)="onCloseDig(true)" class="rounded-5 p-4 me-4">Oui
  </button>
  <button mat-flat-button color="primary" mat-dialog-close class="rounded-5 p-4" (click)="onCloseDig(false)">Non
  </button>
</mat-dialog-actions>
