<app-sketch [inputData]="slide">
  <div *ngIf="tpoData">
    <div class="d-flex align-items-center c-pointer">
      <mat-icon (click)="onGoBack()" class="me-3">arrow_back</mat-icon>
      <h4 class="text-primary mb-0">{{tpoData.tpo}}</h4>
    </div>

    <div class="mt-3">
      <div class="d-flex justify-content-center mb-3">
        <div class="d-flex align-items-center">
          <div class="tpo-item-verb tpo-item-verb-1 me-2 d-flex justify-content-center align-items-center">
            <img src="assets/verb.svg" alt="" srcset="" class="w-50">
          </div>
          <div>
            <h6 class="text-primary">Verb</h6>
            <h6 class="mb-0">{{tpoData.verb}}</h6>
          </div>
        </div>

        <div class="d-flex align-items-center tpo-center-mg"
             [class]="{'tpo-center-mg' : tpoData.critical, 'tpo-center-mg-2': !tpoData.critical}">
          <div class="tpo-item-verb tpo-item-verb-2 me-2 d-flex justify-content-center align-items-center">
            <img src="assets/condition.svg" alt="" srcset="" class="w-50">
          </div>
          <div>
            <h6 class="text-primary">Condition</h6>
            <h6 class="mb-0">{{tpoData.tpoCondition}}</h6>
          </div>
        </div>

        <div class="d-flex align-items-center" *ngIf="tpoData.critical">
          <div class="tpo-item-verb tpo-item-verb-3 me-2 d-flex justify-content-center align-items-center">
            <img src="assets/failure.svg" alt="" srcset="" class="w-50">
          </div>
          <div>
            <h6 class="text-danger-custom mb-0">{{tpoData.critical ? 'CRITICAL' : ''}}</h6>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center align-items-center mt-5">
        <button mat-stroked-button color="primary" class="rounded-5 p-4 flex-row-reverse me-5" (click)="onEditFlow()">
          Edit flow
          <mat-icon class="ms-2 me-0">edit</mat-icon>
        </button>

        <button mat-stroked-button color="primary" class="rounded-5 p-4 flex-row-reverse me-5"
                (click)="onAddWorkOrder()">
          Add new WK
          <mat-icon class="ms-2 me-0">add</mat-icon>
        </button>

        <button mat-stroked-button color="primary" class="rounded-5 p-4 flex-row-reverse" (click)="onUseWorkOrder()">
          Use existing WK
          <mat-icon class="ms-2 me-0">loop</mat-icon>
        </button>
      </div>
    </div>

    <div class="mt-4">
      <h5>Work order execution flow</h5>
      <div class="mt-4 d-flex align-items-center flex-wrap">

        <ng-container *ngFor="let wk of tpoWorkOrders; let index = index">
          <div class="d-flex align-items-center justify-content-between wo-class p-3 rounded-4 col-2 mb-4">
            <div>
              <h6 class="wo-class-title fw-normal">{{wk.equipment}}</h6>
              <h6 class="fw-normal wo-class-name">{{wk.webServiceName}}</h6>
            </div>
            <div>
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="editWorkOrder(wk)">Edit</button>
                <button mat-menu-item (click)="onRemoveWkFromTpo(wk)">Remove</button>
              </mat-menu>
            </div>
          </div>
          <div class="wo-class-direction mb-4" *ngIf="tpoWorkOrders[index+1] && (index+1)%4 != 0">
            <img src="assets/arrow_next.svg" class="w-100" alt="" srcset="">
          </div>
        </ng-container>
      </div>
    </div>

    <div class="mt-4">
      <h5>Work order execution flow in the event of failure</h5>
      <div class="mt-4 d-flex align-items-center flex-wrap">

        <ng-container *ngFor="let wk of failureTpoWorkOrders; let index = index">
          <div class="d-flex align-items-center justify-content-between wo-class-2 p-3 rounded-4 col-2 mb-4">
            <div>
              <h6 class="wo-class-2-title fw-normal">{{wk.equipment}}</h6>
              <h6 class="fw-normal wo-class-2-name">{{wk.webServiceName}}</h6>
            </div>
            <div>
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="editWorkOrder(wk,true)">Edit</button>
                <!--                <button mat-menu-item>Delete</button>-->
              </mat-menu>
            </div>
          </div>
          <div class="wo-class-direction mb-4" *ngIf="failureTpoWorkOrders[index+1] && (index+1)%4 != 0">
            <img src="assets/arrow_next.svg" class="w-100" alt="" srcset="">
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</app-sketch>
