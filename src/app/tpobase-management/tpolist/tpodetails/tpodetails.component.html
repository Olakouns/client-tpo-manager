<app-sketch [inputData]="slide">
  <div>
    <div class="d-flex align-items-center c-pointer">
      <mat-icon (click)="onGoBack()" class="me-3">arrow_back</mat-icon>
      <h4 class="text-primary mb-0">TPO_DELETE_SUBSCRIBER</h4>
    </div>

    <div class="mt-3">
        <div class="d-flex justify-content-center mb-3">
          <div class="d-flex align-items-center">
            <div class="tpo-item-verb tpo-item-verb-1 me-2 d-flex justify-content-center align-items-center">
              <img src="assets/verb.svg" alt="" srcset="" class="w-50">
            </div>
            <div>
              <h6 class="text-primary">Verb</h6>
              <h6 class="mb-0">VERB</h6>
            </div>
          </div>

          <div class="d-flex align-items-center tpo-center-mg">
            <div class="tpo-item-verb tpo-item-verb-2 me-2 d-flex justify-content-center align-items-center">
              <img src="assets/condition.svg" alt="" srcset="" class="w-50">
            </div>
            <div>
              <h6 class="text-primary">Condition</h6>
              <h6 class="mb-0">TPO_CONDITION</h6>
            </div>
          </div>

          <div class="d-flex align-items-center">
            <div class="tpo-item-verb tpo-item-verb-3 me-2 d-flex justify-content-center align-items-center">
              <img src="assets/failure.svg" alt="" srcset="" class="w-50">
            </div>
            <div>
              <h6 class="text-danger-custom mb-0">CRITICAL</h6>
            </div>
          </div>
        </div>

      <div class="d-flex justify-content-center align-items-center mt-5">
        <button mat-stroked-button color="primary" class="rounded-5 p-4 flex-row-reverse me-5" (click)="onEditFlow()">
          Edit flow
          <mat-icon class="ms-2 me-0">edit</mat-icon>
        </button>

        <button mat-stroked-button color="primary" class="rounded-5 p-4 flex-row-reverse" (click)="onAddWorkOrder()">
          Add WK
          <mat-icon class="ms-2 me-0">add</mat-icon>
        </button>
      </div>
    </div>
  </div>
</app-sketch>
