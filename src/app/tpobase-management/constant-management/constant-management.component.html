<app-sketch [inputData]="slide">
  <div class="d-flex align-items-center c-pointer">
    <mat-icon (click)="onGoBack()" class="me-3">arrow_back</mat-icon>
    <h4 class="text-primary mb-0">Network elements</h4>
  </div>

  <div class="mt-4">
    <div class="row">
      @if (loading) {
      @for (item of [1,2,3,4,5,6]; track $index) {
      <div class="col-md-4 mb-4">
        <app-loader-skeleton-item></app-loader-skeleton-item>
      </div>
      }
      } @else {
      @for (item of constantsConfig; track $index) {
      <div class="col-md-4 mb-4">
        <app-constant-item [constantConfig]="item" (onDelete)="onDeleteConstant($event)"></app-constant-item>
      </div>
      }
      }
    </div>
  </div>
</app-sketch>
