<div class="pt-4 px-3">
    <h4 class="my-dialog-title text-center">{{diagTitle}}</h4>
  </div>
<mat-dialog-content>
    <div class="my-dialog">
        <div class="alert alert-danger" *ngIf="hasError">
            {{errorMessage}}
        </div>
        <!--  form-->
        <div class="mt-4">

            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <input matInput placeholder="IN or HLR" formControlName="keyName">
                    <mat-error *ngIf="form.controls['keyName']?.hasError('required')">Required field</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <input matInput placeholder="url of webservice" formControlName="valueContent">
                    <mat-error *ngIf="form.controls['valueContent']?.hasError('required')">Required field</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <input matInput placeholder="wsdl documentation url" formControlName="wsdlDoc">
                    <mat-error *ngIf="form.controls['wsdlDoc']?.hasError('required')">Required field</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <textarea matInput placeholder="More description" formControlName="description"></textarea>
                </mat-form-field>

                <div class="d-flex justify-content-center align-items-center" *ngIf="!isLoading">
                    <button mat-flat-button color="primary" class="rounded-5 p-4 close-btn me-4" type="button"
                        (click)="onClose()">Close
                    </button>
                    <button mat-flat-button color="primary" class="rounded-5 p-4" type="submit">Save</button>
                </div>

                <div class="d-flex justify-content-center" *ngIf="isLoading">
                    <mat-spinner diameter="20" mode="indeterminate"></mat-spinner>
                </div>
            </form>
        </div>
    </div>

</mat-dialog-content>
